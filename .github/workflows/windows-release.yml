name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm typecheck
      - run: pnpm typecheck:desktop
      - run: pnpm desktop:build
      - run: pnpm desktop:test:shell
      - run: pnpm desktop:package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - shell: pwsh
        run: |
          $artifacts = Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' }
          $lines = $artifacts | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $content = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD "release/SHA256SUMS.txt"), $content, [System.Text.UTF8Encoding]::new($false))
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
